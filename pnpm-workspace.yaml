allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
# Supply-chain cooldown: refuse packages published less than 3 days ago
# (minutes), mirroring Renovate's `minimumReleaseAge: "3 days"` — compromised
# releases are usually yanked within that window. See SECURITY.md.
minimumReleaseAge: 4320
# Pinned exceptions to the cooldown (exact versions we deliberately adopted
# before they aged out).
minimumReleaseAgeExclude:
  - '@next/env@16.2.7'
  - '@next/eslint-plugin-next@16.2.7'
  - '@next/swc-darwin-arm64@16.2.7'
  - '@next/swc-darwin-x64@16.2.7'
  - '@next/swc-linux-arm64-gnu@16.2.7'
  - '@next/swc-linux-arm64-musl@16.2.7'
  - '@next/swc-linux-x64-gnu@16.2.7'
  - '@next/swc-linux-x64-musl@16.2.7'
  - '@next/swc-win32-arm64-msvc@16.2.7'
  - '@next/swc-win32-x64-msvc@16.2.7'
  - eslint-config-next@16.2.7
  - next@16.2.7
