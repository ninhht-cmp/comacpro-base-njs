# Force-resolve transitive deps with known CVEs that parents haven't bumped
# yet. Re-check with `pnpm audit --prod` after dependency updates; drop an
# override once the parent ships the patched range itself.
overrides:
  # GHSA-qx2v-qp2m-jg93 — PostCSS XSS in stringify; `next` pins an older one.
  'postcss@<8.5.10': '>=8.5.10'

allowBuilds:
  '@parcel/watcher': false
  # Binary download for source-map upload — not used (we don't upload source
  # maps yet; see instrumentation notes). Flip to true alongside
  # `withSentryConfig` if that changes.
  '@sentry/cli': false
  '@swc/core': false
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
# Supply-chain cooldown: refuse packages published less than 7 days ago
# (minutes) — compromised releases are usually yanked well within that
# window; 7d (as used by dailydotdev/apps) trades slower patch uptake for a
# wider safety margin, fitting a money-adjacent product. Keep Renovate's
# `minimumReleaseAge` in sync. See SECURITY.md.
minimumReleaseAge: 10080
# Pinned exceptions to the cooldown (exact versions we deliberately adopted
# before they aged out).
minimumReleaseAgeExclude:
  - '@next/env@16.2.7'
  - '@next/eslint-plugin-next@16.2.7'
  - '@next/swc-darwin-arm64@16.2.7'
  - '@next/swc-darwin-x64@16.2.7'
  - '@next/swc-linux-arm64-gnu@16.2.7'
  - '@next/swc-linux-arm64-musl@16.2.7'
  - '@next/swc-linux-x64-gnu@16.2.7'
  - '@next/swc-linux-x64-musl@16.2.7'
  - '@next/swc-win32-arm64-msvc@16.2.7'
  - '@next/swc-win32-x64-msvc@16.2.7'
  - eslint-config-next@16.2.7
  - next@16.2.7
