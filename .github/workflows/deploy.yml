name: Deploy

# Builds a container image and publishes it to GitHub Container Registry after
# CI succeeds on main (staging) and on version tags (production). The actual
# rollout (apply to your orchestrator) is a TODO — wire it to the org's target
# once decided (see docs/adr/0001-architecture-and-platform.md, Decision 3 /
# the rollback runbook). Image build + push is real and target-agnostic.
on:
  # Gate on the full CI gate instead of raw pushes to main — never ship an
  # image from a commit whose checks failed. (`workflow_run` only fires for
  # branches; tag pushes below stay direct since CI doesn't run on tags.)
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

# Top-level default; jobs that push images elevate `packages` explicitly.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    # For workflow_run triggers only proceed when CI concluded green; tag
    # pushes and manual dispatches pass through unconditionally.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # On workflow_run, check out the exact commit CI validated (default
          # would be the branch head, which may have moved).
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply-chain attestations: SLSA provenance + SBOM, both stored
          # alongside the image in GHCR.
          provenance: true
          sbom: true

      # Block the rollout if the image we just built ships known-critical CVEs.
      # Scans by digest so we check exactly what was pushed.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          # Only fail on vulnerabilities that have a fix available — unfixable
          # CVEs would otherwise wedge every deploy.
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Roll out
    needs: image
    runs-on: ubuntu-latest
    # Promote to the environment matching the ref: tags → production, main → staging.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    steps:
      - name: Roll out the new image
        run: |
          echo "Image built and pushed. TODO(deploy): apply to the target."
          echo "Examples once the target is chosen:"
          echo "  - Kubernetes: kubectl set image deploy/web web=\$IMAGE && kubectl rollout status ..."
          echo "  - ECS:        aws ecs update-service --force-new-deployment ..."
          echo "  - Nomad/Helm: helm upgrade ... / nomad job run ..."
          echo "Rollback procedure: docs/runbooks/rollback.md"
