name: API codegen freshness

# Fails when the committed orval client drifts from the OpenAPI spec. It needs
# the same spec source the committed code came from, so it runs only when an
# `OPENAPI_SPEC` repo variable is configured (Settings → Variables). Without it,
# the job is skipped and never blocks a PR.
on:
  pull_request:
    paths:
      - 'openapi/**'
      - 'orval.config.ts'
      - 'src/lib/api/generated/**'

concurrency:
  group: api-codegen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh:
    name: Generated client matches spec
    if: ${{ vars.OPENAPI_SPEC != '' }}
    runs-on: ubuntu-latest
    env:
      OPENAPI_SPEC: ${{ vars.OPENAPI_SPEC }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check API client is fresh
        run: pnpm check:api-fresh
