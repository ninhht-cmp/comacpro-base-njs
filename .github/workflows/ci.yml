name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Format · i18n · Test · Build
    runs-on: ubuntu-latest
    env:
      # Skip env validation in CI (no real .env present)
      SKIP_ENV_VALIDATION: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: i18n keys
        run: pnpm check:i18n

      - name: Test
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: pnpm build

      - name: Bundle size budget
        run: pnpm size

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: 'true'
      NEXT_PUBLIC_API_MOCKING: 'enabled'
      NEXT_PUBLIC_API_BASE_URL: 'http://localhost:3000'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lighthouse CI
        run: pnpm lhci

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      # No real .env in CI; the deterministic specs run without a backend.
      # Credentialed flows self-skip unless E2E_USERNAME / E2E_PASSWORD are set.
      SKIP_ENV_VALIDATION: 'true'
      NEXT_PUBLIC_API_MOCKING: 'enabled'
      NEXT_PUBLIC_API_BASE_URL: 'http://localhost:3000'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
