name: Security

# Supply-chain + secret hygiene. Runs on every PR and on main. gitleaks blocks
# on committed secrets; the dependency audit blocks on high/critical advisories.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run the OSS binary directly rather than gitleaks-action — the action
      # requires a paid GITLEAKS_LICENSE for organization repos; the binary does
      # not. Scans the working tree (deterministic, fast); switch to `git` mode
      # if you want full-history scanning.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
      - name: Scan
        run: ./gitleaks detect --source . --no-git --redact --verbose

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit (prod deps, high+)
        run: pnpm audit --prod --audit-level high
