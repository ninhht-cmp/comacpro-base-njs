# Repository settings as code, applied by the Probot "Settings" GitHub App
# (https://github.com/apps/settings). Install the app on the org/repo for this
# file to take effect; otherwise it's documentation of the intended config.

repository:
  has_issues: true
  has_wiki: false
  has_projects: false
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        require_code_owner_reviews: true
        dismiss_stale_reviews: true
      required_status_checks:
        strict: true
        contexts:
          - 'Typecheck · Lint · Format · i18n · Test · Build'
          - 'E2E (Playwright)'
          - 'Lighthouse CI'
          - 'Analyze (javascript-typescript)'
          - 'Secret scan (gitleaks)'
          - 'Dependency audit'
      enforce_admins: false
      required_linear_history: true
      required_conversation_resolution: true
      restrictions: null
