# Repository settings as code, applied by the Probot "Settings" GitHub App
# (https://github.com/apps/settings). Install the app on the org/repo for this
# file to take effect; otherwise it's documentation of the intended config.

repository:
  has_issues: true
  has_wiki: false
  has_projects: false
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true

branches:
  - name: main
    protection:
      # Deliberate for a SOLO maintainer + Renovate automerge: requiring human
      # approvals (or code-owner review) would leave Renovate PRs unmergeable —
      # there is no second human to approve. The required status checks below
      # are the real gate; bump the count back up when a second dev joins.
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: true
      required_status_checks:
        strict: true
        # Contexts must exactly match the CI job `name:`s. Lighthouse is
        # deliberately absent — advisory only until real pages exist (see
        # .github/workflows/ci.yml).
        contexts:
          - 'Typecheck · Lint · Format · i18n · Test · Build'
          - 'E2E (Playwright)'
          - 'PR title (Conventional Commits)'
          - 'Analyze (javascript-typescript)'
          - 'Secret scan (gitleaks)'
          - 'Dependency audit'
      enforce_admins: false
      required_linear_history: true
      required_conversation_resolution: true
      restrictions: null
